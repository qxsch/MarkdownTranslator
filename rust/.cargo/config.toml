# Static binaries: the MSVC C runtime is linked statically on Windows (only system DLLs such as kernel32
# remain); musl targets are static (see .github/workflows/rust.yml for the zig-based Linux build).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
