name: rust

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['rust/**', 'src/**', 'config/**', 'test/**', 'eval/features/**', 'eval/corpus/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: mdtranslate
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: mdtranslate.exe
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # The tree-sitter grammars and mimalloc are C code; zig compiles and links them against musl.
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          pip install ziglang==0.16.0
          cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Test (golden files, CLI contract, unit tests)
        run: cargo test --release --locked

      - name: Build static binary
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Verify the binary is static
        run: |
          bin=target/${{ matrix.target }}/release/${{ matrix.exe }}
          ls -l "$bin"
          if [ "${{ runner.os }}" = "Linux" ]; then
            file "$bin"
            file "$bin" | grep -qE 'statically linked|static-pie linked'
            ! readelf -d "$bin" | grep -q NEEDED
          else
            dumpbin=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe -path '*Hostx64/x64*' | head -n1)
            "$dumpbin" -nologo -dependents "$bin" | tee deps.txt
            ! grep -qiE 'vcruntime|msvcp|api-ms-win-crt' deps.txt
          fi

      - name: Smoke test the static binary
        run: |
          bin=target/${{ matrix.target }}/release/${{ matrix.exe }}
          "$bin" -version
          printf '# Hello\n\nSome **text** and `code`.\n' | "$bin" -sourceFile - -targetFile - -lang de -engine pseudo -quiet | tee out.md
          grep -q 'ÜHELLO' out.md
          # stdin and stdout are the defaults; without -sourceFile, empty input is a usage error (exit code 1),
          # while an explicit empty source gives an empty translation without any service
          printf '# Hello\n' | "$bin" -lang de -engine pseudo -quiet | grep -q 'ÜHELLO'
          code=0; "$bin" -lang de -engine pseudo < /dev/null || code=$?
          [ "$code" -eq 1 ]
          "$bin" -sourceFile - -lang de < /dev/null > empty.md
          [ ! -s empty.md ]

      - uses: actions/upload-artifact@v4
        with:
          name: mdtranslate-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  parity:
    # The committed golden files come from the TypeScript implementation; regenerate them and compare live, so a
    # change on either side that breaks byte-for-byte parity is caught.
    name: TypeScript parity
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mdtranslate-x86_64-unknown-linux-musl
          path: rust/target/release
      - run: chmod +x rust/target/release/mdtranslate
      - name: Golden files are up to date
        run: |
          npx tsx rust/tools/golden.ts
          changes=$(git status --porcelain -- rust/tests/golden)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::rust/tests/golden is stale; run: npx tsx rust/tools/golden.ts"
            exit 1
          fi
      - name: Live comparison of both implementations
        run: npx tsx rust/tools/golden.ts --check
